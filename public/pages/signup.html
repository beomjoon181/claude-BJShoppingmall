<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 - BJShoppingmall</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/signup.js" defer></script>
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <div class="form-narrow">
        <h1 class="page-title">회원가입</h1>
        <form class="panel" id="signup-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">비밀번호 (8자 이상)</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="field">
            <label for="password-confirm">비밀번호 확인</label>
            <input class="input" id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="name">이름</label>
            <input class="input" id="name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="phone">전화번호</label>
            <input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="010-1234-5678" required />
          </div>
          <div class="field">
            <label for="address">주소</label>
            <input class="input" id="address" name="address" autocomplete="street-address" required />
          </div>
          <button class="btn btn-primary btn-large btn-block" type="submit">가입하기</button>
          <p class="form-help">이미 회원이신가요? <a href="/login">로그인</a></p>
        </form>
      </div>
    </main>
  </body>
</html>
